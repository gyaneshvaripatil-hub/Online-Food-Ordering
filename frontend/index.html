<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../frontend/css/style.css">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <title>Online Food Ordering Website</title>
</head>
<body>
    <nav class="navbar mb-4">
        <div class="container">
            <a href="#" class="navbar-brand"><i class="fa-solid fa-utensils"></i>
                Food-Hub
            </a>
            <button type="button" class="toggle-btn">
                <span><i class="fa-solid fa-cart-shopping text-white"></i></span>
            </button>
        </div>
    </nav>
    <div class="container">
        <div class="row mt-2">
            <div class="col-md-8">
                <div class="search-container">
                    <input type="text" id="searchInput" class="search-input w-100" placeholder="🔍 Search for food...">
                </div>
                <div id="categoryContainer"></div>
               <div class="row mt-4" id="allCard"></div>
            </div>
            <div class="col-md-4" id=''>
                <div class="cart-sidebar">
                    <div class="cart-sidebar-title" >
                        <i class="fa-solid fa-cart-shopping"></i>
                        Your Cart
                    </div>
                    
                    <div id="cartSidebar"></div>
                    <button class="checkout-btn" disabled >
                        <i class="fa-solid fa-credit-card"></i>
                           Proceed to Checkout
                    </button>
                </div>
            </div>
        </div>  
    </div>

    <!-- <script src="./js/category.js"></script> -->
    <!-- <script src="./js/food.js"></script> -->
    <!-- <script src="./js/app.js"></script> -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>
